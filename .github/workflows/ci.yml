name: Fraud Detection CI

on:
    push:
        paths-ignore:
          - 'README.md'
          - 'docs/**'

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Repository 
              uses: actions/checkout@v4
            
            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                python-version: '3.11'
                cache: 'pip'

            - name: Install Dependencies
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt

            - name: Run Tests
              run: pytest tests/test_predict.py

            - name: install build package
              run: pip install build

            - name: Build Package
              run: python -m build

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                name: fraud_model_package
                path: dist/
    
    docker:
        needs: test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout Repository 
              uses: actions/checkout@v4

            - name: Build FastAPI Docker Image
              run: |
                docker build -f Dockerfile -t fraud-api:latest .

            - name: Build Streamlit Docker Image
              run: |
                docker build -f Dockerfile.streamlit -t fraud-streamlit:latest .
            
            - name: Login to Docker Hub
              uses: docker/login-action@v3
              with:
                username: ${{ secrets.DOCKER_USERNAME }}
                password: ${{ secrets.DOCKER_PASSWORD }}

            - name: Tag FastAPI Image
              run: docker tag fraud-api:latest davidmba819/fraud-api:latest

            - name: Tag Streamlit Image
              run: docker tag fraud-streamlit:latest davidmba819/fraud-streamlit:latest

            - name: Push FastAPI Image
              run: docker push davidmba819/fraud-api:latest

            - name: Push Streamlit Image
              run: docker push davidmba819/fraud-streamlit:latest